version: "3.8"

services:
  app:
    #this actually should be fixed but is fine here because my image is always the same 

    image: ${DOCKER_USERZ}/${PROJECT_NAME}-app:${APP_TAG}
    container_name: ${PROJECT_NAME}-app
    restart: always
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 15s

    networks:
      - app-network

  nginx:
  #this actually should be fixed but is fine here because my image is always the same 
    image: ${DOCKER_USERZ}/${PROJECT_NAME}-nginx:${APP_TAG}
    container_name: ${PROJECT_NAME}-nginx
    restart: always
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
