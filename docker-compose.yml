version: "3.8"

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget","-qO-","http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile.nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
