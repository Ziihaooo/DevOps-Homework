<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zihao's Ghibli Dream Page</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: "Gill Sans", sans-serif;
        background: linear-gradient(#8cc8f8, #bfe5ff 70%, #7ac86a 70%, #5ca852);
    }

    /* --- Sun --- */
    .sun {
        position: absolute;
        top: 50px;
        right: 150px;
        width: 90px;
        height: 90px;
        background: #ffe066;
        border-radius: 50%;
        box-shadow: 0 0 40px #ffef9f;
        animation: spin 15s linear infinite;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* --- Clouds --- */
    .cloud {
        position: absolute;
        top: 120px;
        left: -200px;
        width: 160px;
        height: 60px;
        background: #ffffffd8;
        border-radius: 50px;
        animation: moveClouds 40s linear infinite;
    }
    .cloud::before,
    .cloud::after {
        content: "";
        position: absolute;
        background: #ffffffd8;
        width: 100px;
        height: 80px;
        border-radius: 50%;
        top: -20px;
    }
    .cloud::before { left: 20px; }
    .cloud::after { left: 70px; }

    @keyframes moveClouds {
        0% { transform: translateX(0); }
        100% { transform: translateX(150vw); }
    }

    /* --- Ghibli Tree --- */
    .tree {
        position: absolute;
        left: 100px;
        bottom: 160px;
        width: 160px;
        height: 200px;
    }

    .trunk {
        width: 35px;
        height: 90px;
        background: #8b5a2b;
        border-radius: 10px;
        position: absolute;
        left: 60px;
        bottom: 0;
    }

    .leaves {
        width: 180px;
        height: 130px;
        background: #3e9646;
        border-radius: 50%;
        position: absolute;
        bottom: 70px;
        left: -10px;
        box-shadow:
            -20px 10px 0 #4aa857,
            20px 10px 0 #4aa857,
            0 20px 0 #5cb869;
    }

    /* --- Cute Sleeping Boy --- */
    .boy {
        position: absolute;
        right: 180px;
        bottom: 150px;
        width: 200px;
        height: 150px;
    }

    .face {
        width: 70px;
        height: 70px;
        background: #ffd7b3;
        border-radius: 50%;
        position: absolute;
        left: 20px;
        bottom: 60px;
        box-shadow: inset -5px -5px 0 rgba(0,0,0,0.1);
    }

    .hair {
        width: 70px;
        height: 35px;
        background: #2e2e2e;
        border-radius: 50% 50% 20% 20%;
        position: absolute;
        bottom: 85px;
        left: 20px;
    }

    .eyes {
        position: absolute;
        bottom: 90px;
        left: 45px;
        font-size: 18px;
        color: #333;
        opacity: 0.85;
    }

    .body {
        width: 130px;
        height: 50px;
        background: #ffcfa5;
        border-radius: 40px;
        position: absolute;
        bottom: 30px;
        left: 40px;
        transform: rotate(20deg);
    }

    .zzz {
        position: absolute;
        bottom: 110px;
        left: 120px;
        font-size: 20px;
        animation: floatZ 3s ease-in-out infinite;
    }

    @keyframes floatZ {
        0% { transform: translateY(0); opacity: .6; }
        50% { transform: translateY(-8px); opacity: 1; }
        100% { transform: translateY(0); opacity: .6; }
    }

    /* --- Dream Bubble (big popup) --- */
    .dream-bubble {
        position: absolute;
        top: 50px;
        left: 0;
        right: 0;
        margin: auto;
        width: 500px;        
        height: 350px;       
        background: rgba(255,255,255,0.95);
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        transform: scale(0);
        opacity: 0;
        transition: 0.5s ease;
        overflow: hidden;     
    }

    .dream-bubble.show {
        transform: scale(1);
        opacity: 1;
    }

    /* --- SPEECH BUBBLE (Dream Button - Style C) --- */
    .speech-bubble {
        position: absolute;
        right: 260px;
        bottom: 260px;
        background: white;
        border: 3px solid #333;
        padding: 15px 25px;
        border-radius: 12px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 4px 4px 0 #000;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .speech-bubble::after {
        content: "";
        position: absolute;
        bottom: -18px;
        left: 20%;
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 18px solid white;
        filter: drop-shadow(0px 2px 0px #333);
    }

    .speech-bubble:active {
        transform: scale(0.9);
        box-shadow: 2px 2px 0 #000;
    }

</style>
</head>

<body>

<div class="sun"></div>

<div class="cloud" style="animation-delay: 0s;"></div>
<div class="cloud" style="top: 180px; animation-delay: 10s;"></div>
<div class="cloud" style="top: 230px; animation-delay: 20s;"></div>

<div class="tree">
    <div class="trunk"></div>
    <div class="leaves"></div>
</div>

<div class="boy">
    <div class="hair"></div>
    <div class="face"></div>
    <div class="eyes">— —</div>
    <div class="body"></div>
    <div class="zzz">Zzz…</div>
</div>

<!-- 漫画对白框 Dream 按钮 -->
<div id="speechDream" class="speech-bubble">🌙 Dream →</div>

<!-- Dream Popup -->
<div id="dreamBubble" class="dream-bubble">🌟 Entering a dream...</div>

<script>
function showDream() {
    const bubble = document.getElementById("dreamBubble");
    bubble.classList.add("show");

    const images = [
        "images/dream1.png",
        "images/dream2.png",
        "images/dream3.png",
        "images/dream4.png",
        "images/dream5.png",
        "images/dream6.png"
    ];

    const selected = images[Math.floor(Math.random() * images.length)];

    bubble.innerHTML = `
        <img src="${selected}" style="
            width: 90%;
            border-radius: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.3);
        ">
    `;
}

document.getElementById("speechDream").addEventListener("click", () => {
    showDream();
});
</script>


</body>
</html>
