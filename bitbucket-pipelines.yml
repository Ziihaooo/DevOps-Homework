image: docker:24

pipelines:
  branches:
    DEVOPSOCT-48:
      - step:
          name: Lint & Build & Push
          services:
            - docker
          script:
            - apk add --no-cache make git
            # AC1 – Lint gate
            - make lint
            - export DOCKER_BUILDKIT=0
            # AC2 – Image published
            - make build
            - make login
            - make push

      - step:
          name: Upload Config to S3
          oidc: true
          script:
            - apk add --no-cache aws-cli make
            - export AWS_ROLE_ARN="arn:aws:iam::314146318322:role/PIPELINEOIDCROLE_ZIHAO"
            - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/bb.token"
            - export AWS_REGION="ap-southeast-2"
            
            # Verify OIDC
            - make OICDcheck

      - step:
          name: Deploy & Validate (via AWS OIDC + SSM)
          oidc: true
          script:
            - apk add --no-cache aws-cli make curl
            - export AWS_ROLE_ARN="arn:aws:iam::314146318322:role/PIPELINEOIDCROLE_ZIHAO"
            - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/bb.token"
            - export AWS_REGION="ap-southeast-2"
            - export DOCKER_BUILDKIT=0
            - export DOCKER_USERZ=$DOCKER_USERZ
            
            # AC6 – Deploy via SSM to EC2 (downloads from S3, runs make up)
            - make deploy
            
            # AC3–AC5 – Verify Nginx & Health
            - make verify
