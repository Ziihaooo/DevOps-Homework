image: docker:24

pipelines:
  branches:
    DEVOPSOCT-48:
      - step:
          name: Lint & Build & Push
          services:
            - docker
          script:
            - apk add --no-cache make git
            # AC1 – Lint gate
            - make lint
            # AC2 – Image published
            - make build
            - make push

      - step:
          name: Deploy & Validate (via AWS OIDC + SSM)
          oidc: true
          script:
            - apk add --no-cache aws-cli make curl
            # AC6 pre-check – Verify Bitbucket OIDC → AWS
            - make OICDcheck
            # AC6 – Deploy via SSM to EC2 (runs make up)
            - make deploy
            # AC6 – Deploy via SSM to EC2 (runs make up)
            - make deploy
            # AC3–AC5 – Verify Nginx & Health
            - make verify
