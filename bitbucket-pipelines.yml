image: docker:24

options:
  docker: true

pipelines:
  branches:
    DEVOPSOCT-40:
      - step:
          name: Build & Security Sccan
          services:
            - docker
          script:
            - apk add --no-cache curl make 
            - export DOCKER_BUILDKIT=0
            - make trivydownload
            - make build
            - make start
            - make scan
            - make trivyconfig
            - make logs
            - make down
