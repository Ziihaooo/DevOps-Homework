image: docker:24

pipelines:
  branches:
    DEVOPSOCT-66:

      - step:
          name: Lint & Build & Push
          services:
            - docker
          script:
            - apk add --no-cache make git
            - make lint
            - export DOCKER_BUILDKIT=0
            - make build
            - make login
            - make push

      - step:
          name: Terraform Validation
          script:
            - apk add --no-cache bash curl unzip make
            - make tf-install
            - make tf-validate

      - step:
          name: Terraform Plan
          oidc: true
          script:
            - apk add --no-cache bash curl unzip aws-cli jq make
            - make aws-oidc
            - make tf-install
            - make tf-plan

      - step:
          name: Terraform Apply
          trigger: manual
          oidc: true
          script:
            - apk add --no-cache bash curl unzip aws-cli jq make
            - make aws-oidc
            - make tf-install
            - make tf-apply

      - step:
          name: Terraform Destroy
          trigger: manual
          oidc: true
          script:
            - apk add --no-cache bash curl unzip aws-cli jq make
            - make aws-oidc
            - make tf-install
            - make tf-destroy
