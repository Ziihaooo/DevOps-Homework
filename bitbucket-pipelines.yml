image: docker:24

pipelines:
  branches:
    DEVOPSOCT-61:
      - step:
          name: Lint & Build & Push
          services:
            - docker
          script:
            - apk add --no-cache make git
            - make lint
            - export DOCKER_BUILDKIT=0
            - make build
            - make login
            - make push
            - make up