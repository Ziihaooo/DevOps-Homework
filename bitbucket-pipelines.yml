image: docker:24

options:
  docker: true

pipelines:
  branches:
    DEVOPSOCT-36:
      - step:
          name: Class_Exercise
          services:
            - docker
          script:
            - apk add --no-cache curl 
            - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            - docker build -t class .
            - ./trivy image --severity HIGH,CRITICAL class
