#DOCKER IMAGE TO RUN DOCKER COMMAND
image: docker:24.0.5
#ALL PIPELINE COMMAND
pipelines:
  branches:
    #my branch
    DEVOPSOCT-29:
    #step for making the nginx server up
      - step:
          name: Build and Deploy
            #let pipeline run docker command
          services:
            - docker
          script:
          #install make in pipelines
            - apk add --no-cache make
            - make build
            - make run
            - make stop
