image: docker:24

pipelines:
  branches:
    DEVOPSOCT-61:
      - step:
          name: Lint & Build & Push
          services:
            - docker
          script:
            - apk add --no-cache make git
            - make lint
            - export DOCKER_BUILDKIT=0
            - make build
            - make login
            - make push
            #actually dont need make up but I did it here just for checking the container work in pipelines
            - make up
      
      - step:
          name: Terraform Validation
          script:
            - apk add --no-cache terraform
            - terraform -version
            - cd infra/env/dev
            - terraform init -backend=false
            - terraform validate