image: docker:20.10.24        # 外层管道运行在官方 Docker in Docker 镜像

options:
  docker: true

pipelines:
  branches:
    DEV-24:
      - step:                # 1️⃣ 扫描官方基础镜像
          name: base-scan
          image: aquasec/trivy:0.49.1
          script:
            - trivy image --severity CRITICAL,HIGH ubuntu:focal-20210713 | tee base-scan.txt
      - step:                # 2️⃣ 构建并推送加固镜像
          name: build-push-secure
          services:
            - docker
          caches:
            - docker
          script:
            - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            - docker build -t $DOCKER_USERNAME/mypatched:secure -f secure-docker/Dockerfile.after .
            - docker push $DOCKER_USERNAME/mypatched:secure
      - step:                # 3️⃣ 再次扫描加固镜像
          name: secure-scan
          image: aquasec/trivy:0.49.1
          script:
            - trivy image --severity CRITICAL,HIGH $DOCKER_USERNAME/mypatched:secure | tee secure-scan.txt
      - step:                # 4️⃣ 运行验证
          name: run-test
          services:
            - docker
          script:
            - docker pull $DOCKER_USERNAME/mypatched:secure
            - docker run --rm $DOCKER_USERNAME/mypatched:secure
